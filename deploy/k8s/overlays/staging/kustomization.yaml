apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: showcase-staging
resources:
  - ../../base
# Staging: fewer replicas to save money
patches:
  - target: { kind: Deployment, name: order-service }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: { kind: HorizontalPodAutoscaler, name: order-service }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
  - target: { kind: PodDisruptionBudget, name: order-service }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
# CI runs "kustomize edit set image" which adds an images: block here
