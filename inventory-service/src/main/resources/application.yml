# inventory-service configuration (see order-service/application.yml for the general explanations)
spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true            # gRPC handlers, Kafka listeners and MVC all run on virtual threads

  # --- MONGODB (Spring Boot 4 moved the connection settings from spring.data.mongodb.* to spring.mongodb.*)
  mongodb:
    uri: mongodb://localhost:27017/inventory?replicaSet=rs0   # replicaSet is required for transactions
  data:
    mongodb:
      auto-index-creation: true   # creates @Indexed/@CompoundIndex/@TextIndexed at startup. Convenient for DEV;
                                  # in production, create indexes deliberately (migrations / mongosh scripts), since
                                  # building an index on a large live collection is an operational event.

  # --- KAFKA with TRANSACTIONS (exactly-once consume-transform-produce, see OrderEventsListener)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      transaction-id-prefix: inventory-tx-   # enables transactions; Boot then adds a KafkaTransactionManager
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      isolation-level: read_committed        # never read records of aborted transactions
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

---
spring:
  config:
    activate:
      on-profile: cds-training
  kafka:
    listener:
      auto-startup: false
  data:
    mongodb:
      auto-index-creation: false
